apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.circuitstream.f1'
    compileSdk 35
    defaultConfig {
        applicationId 'com.circuitstream.f1'
        minSdk 23
        targetSdk 35
        versionCode 20001
        versionName '2.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true }
    sourceSets.main.assets.srcDirs = [layout.buildDirectory.dir('generated/webAssets')]
    signingConfigs {
        if (System.getenv('CIRCUIT_STREAM_KEYSTORE')) {
            production {
                storeFile file(System.getenv('CIRCUIT_STREAM_KEYSTORE'))
                storePassword System.getenv('CIRCUIT_STREAM_STORE_PASSWORD')
                keyAlias System.getenv('CIRCUIT_STREAM_KEY_ALIAS')
                keyPassword System.getenv('CIRCUIT_STREAM_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('CIRCUIT_STREAM_KEYSTORE')) {
                signingConfig signingConfigs.production
            }
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core-ktx:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

tasks.register('verifyWebAssets') {
    doLast {
        if (!layout.buildDirectory.file('generated/webAssets/public/index.html').get().asFile.exists()) {
            throw new GradleException('Web assets missing. Run npm run android:prepare from frontend first.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyWebAssets' }
